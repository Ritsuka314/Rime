# Rime schema
# encoding: utf-8

schema:
  schema_id: flypy_jiugong
  name: 小鹤九宫双拼
  version: "0.19"
  author:
    - Jaaiko <lyhhap@hotmail.com>
  description: |
    小鹤九宫双拼：
    以小鹤为基础所配置的一款适合在手机九宫格上输入的输入方案。
  dependencies:
    - emoji

switches:
  - name: ascii_mode
    states: [ 中, 英 ]
  - name: simplification
    states: [ 简, 繁 ]
  - name: full_shape
    states: [ 半, 全 ]
  - name: ascii_punct
    #states: [ ，。, ，． ]
    states: ["句讀","符號"]
  - name: symbol_support
    states: [ "无符", "符" ]
  - name: emoji_suggestion
    states: [ 😑️, 😁️ ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
    - table_translator@custom_phraseVD
    - table_translator@custom_phraseXT
  filters:
    - simplifier@symbol_support
    - simplifier@emoji_suggestion
    - simplifier
    - uniquifier

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba1234567890'
  delimiter: " '"
  algebra:
    - "xlit|12345|+_*^0|"
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^ya$/yia/
    - derive/^yan$/yian/
    - derive/^yang$/yiang/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Q/
    - xform/(.)ei$/$1W/
    - xform/uan$/R/
    - xform/[uv]e$/T/
    - xform/un$/Y/
    - xform/^sh/U/
    - xform/^ch/I/
    - xform/uo$/O/
    - xform/ie$/P/
    - xform/i?ong$/S/
    - xform/(.)ai$/$1D/
    - xform/(.)en$/$1F/
    - xform/(.)eng$/$1G/
    - xform/(.)ang$/$1H/
    - xform/(.)an$/$1J/
    - xform/ing$|uai$/K/
    - xform/[iu]ang$/L/
    - xform/(.)ou$/$1Z/
    - xform/[iu]a$/X/
    - xform/(.)ao$/$1C/
    - xform/^zh/V/
    - xform/ui$/V/
    - xform/in$/B/
    - xform/iao$/N/
    - xform/ian$/M/
    - xlit/QWRTYUIOPSDFGHJKLZXCVBNM/qwrtyuiopsdfghjklzxcvbnm/
    - derive/a/2/
    - derive/b/2/
    - derive/c/2/
    - derive/d/3/
    - derive/e/3/
    - derive/f/3/
    - derive/g/4/
    - derive/h/4/
    - derive/i/4/
    - derive/j/5/
    - derive/k/5/
    - derive/l/5/
    - derive/m/6/
    - derive/n/6/
    - derive/o/6/
    - derive/p/7/
    - derive/q/7/
    - derive/r/7/
    - derive/s/7/
    - derive/t/8/
    - derive/u/8/
    - derive/v/8/
    - derive/w/9/
    - derive/x/9/
    - derive/y/9/
    - derive/z/9/
    - derive/[+_*^0]//
    - derive/([+_*^0])$//
    - derive/^(.*)$/\U$1/

custom_phraseVD:
  dictionary: ""
  user_dict: flypy_top
  db_class: stabledb
  enable_sentence: false
  enable_completion: false
  initial_quality: 0 #用户词和系统词重码 置顶
  comment_format:                       # 提示码自定义
#    - xform/.+//                        # 配置：消除所有候选词后的提示码
  
custom_phraseXT:
  dictionary: ""
  user_dict: flypy_sys
  db_class: stabledb
  enable_sentence: false
  enable_completion: false
  initial_quality: -1 #本表词和系统词重码居后
  comment_format:                       # 提示码自定义
#    - xform/.+//                        # 配置：消除所有候选词后的提示码

translator:
  dictionary: luna_pinyin.extended  # 載入朙月拼音擴充詞庫
  prism: flypy_jiugong
  spelling_hints: 16 # ～字以內候選標註完整帶調拼音
  enable_sentence: true               
  enable_user_dict: true               
  enable_encoder: true                 
  encode_commit_history: true          
  max_phrase_length: 10     
  user_dict: user                                                      
  db_class: tabledb                     
  disable_user_dict_for_patterns:       
    - "^z.*$"
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
    - xform/eh/ê/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - "xlit|v|ü|"
    - xform/iü/iv/
    - xform/uü/uv/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"

emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
# symbol_support
symbol_support:
  opencc_config: symbol.json
  option_name: symbol_support
  tips: all