# Trime default style settings
# encoding: utf-8

config_version: "for小鹤主题5.4"
name: 霓裳助記
# 本主题依附于小鹤主题使用，下面__include: 之后紧跟的就是主题名
# 如使用本主题，小鹤主题名应为：trime.yaml；如小鹤主题名为：小鹤.trime.yaml，则需在本文件内查找“__include: trime”替换为“__include: 小鹤.trime”
# --高度调节--在小鹤主题内进行
author: 散步的鹤 flypy.com #作者资讯

width: 
# ----------空格行键宽度调整------------

  H: &HCK 17          #回车
  K: &KGK 35         #空格
  S: &SBK 16          #数字标点
  #空格行 数字标点S*3+空格K+回车H=100
  
# ----------调整结束------------
style:
  __include: trime:/style
android_keys:
  __include: trime:/android_keys
liquid_keyboard:
  __include: trime:/liquid_keyboard
preset_keys:
  __include: trime:/preset_keys
fallback_colors:
  __include: trime:/fallback_colors
preset_color_schemes:
  __include: trime:/preset_color_schemes
preset_keyboards:
  __include: trime:/preset_keyboards
  default:
    __include: trime:/preset_keyboards/default
    __patch:
      "keys/@0/hint": 'iu'    # q
      "keys/@1/hint": 'ei'    # w
      "keys/@2/hint": 'e'     # e
      "keys/@3/hint": 'uan'   # r
      "keys/@4/hint": 'ue üe' # t
      "keys/@5/hint": 'un'    # y
      "keys/@6/hint": 'sh u'  # u
      "keys/@7/hint": 'ch i'  # i
      "keys/@8/hint": 'o uo'  # o
      "keys/@9/hint": 'ie'    # p

      "keys/@11/hint": 'a'    # a
      "keys/@12/hint": '(i)ong'   # s
      "keys/@13/hint": 'ai'   # d
      "keys/@14/hint": 'en'   # f
      "keys/@15/hint": 'eng'  # g
      "keys/@16/hint": 'ang'  # h
      "keys/@17/hint": 'an'   # j
      "keys/@18/hint": 'uai ing'  # k
      "keys/@19/hint": '(i/u)ang'  # l

      "keys/@22/hint": 'ou'   # z
      "keys/@23/hint": 'ia ua'    # x
      "keys/@24/hint": 'ao'   # c
      "keys/@25/hint": 'zh ui ü⁠'  # v
      "keys/@26/hint": 'in'   # b
      "keys/@27/hint": 'iao'  # n
      "keys/@28/hint": 'ian'  # m
      
      "keys/@11/long_click": select_all
      "keys/@13/long_click": '-'
      "keys/@14/long_click": ";"
      "keys/@30/key_symbol_offset_x": 0
      "keys/@30/width": *SBK
      "keys/@31/width": *SBK
      "keys/@31/long_click": "!"
      "keys/@31/composing": 
      "keys/@31/key_symbol_offset_x": 0
      "keys/@32": {click: space, width: *KGK, key_text_size: 9, key_text_offset_x: 0, key_text_offset_y: 3, key_symbol_offset_x: 0, key_symbol_offset_y: 6, long_click: Mode_switch, swipe_left: Left, swipe_right: Right, key_back_color: kgb, key_text_color: kgt, key_symbol_color: kgs, hilited_key_back_color: kgh, hilited_key_text_color: kght, hilited_key_symbol_color: kghs}
      "keys/@33": {click: ".", label: "  。", width: *SBK, composing: delimiterJ, long_click: "?", key_back_color: bdb, key_text_color: bdt, key_symbol_color: bds, hilited_key_back_color: bdh, hilited_key_text_color: bdht, hilited_key_symbol_color: bdhs}
      "keys/@34/width": *HCK
      "keys/@34/key_symbol_offset_x": 0
    key_symbol_offset_x: 0