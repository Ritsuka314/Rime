# Personal global settings applied on top of Rime Ice.
patch:
  schema_list:
    - schema: double_pinyin_flypy

  menu/page_size: 5

  # Commit the raw code and switch to English with either Shift key.
  ascii_composer/switch_key/Shift_L: commit_code
  ascii_composer/switch_key/Shift_R: commit_code

  # Ctrl+grave is provided by Rime Ice's default switcher hotkeys.
  # Select Traditional once after the first deployment; save_options remembers it.
